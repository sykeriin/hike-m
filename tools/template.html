<!DOCTYPE html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title></title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none;}
canvas:active{cursor:grabbing;}
#loader{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,#1b1d22 0%,#0b0d10 70%);display:flex;align-items:center;justify-content:center;transition:opacity 1.5s ease;z-index:10;pointer-events:none;}
#lwrap{position:relative;width:min(38vw,360px);height:90px;}
#lridge{position:absolute;left:0;right:0;bottom:22px;height:60px;opacity:.55;}
#ltrack{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
#lbar{height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#b8542e,#d59a45,#9aa77e,#cfcac0);transition:transform .35s ease;}
#lsun{position:absolute;width:10px;height:10px;border-radius:50%;background:#e9b872;box-shadow:0 0 18px 6px rgba(233,184,114,.35);left:50%;top:0;margin-left:-5px;animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5;transform:translateY(4px)}50%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="loader"><div id="lwrap"><div id="lsun"></div>
<svg id="lridge" viewBox="0 0 360 60" preserveAspectRatio="none"><path d="M0 60 L0 44 L40 38 L70 26 L96 30 L130 12 L160 22 L190 8 L222 24 L250 18 L282 32 L320 26 L360 36 L360 60 Z" fill="none" stroke="#c9a67a" stroke-width="1.2" stroke-linejoin="round"/><path d="M0 50 L50 46 L90 40 L140 44 L200 36 L260 42 L310 38 L360 46" fill="none" stroke="#7c8a6e" stroke-width="1" opacity=".7"/></svg>
<div id="ltrack"><div id="lbar"></div></div></div></div>
<script>/*BUNDLE*/</script>
</body>
</html>
